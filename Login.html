<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin" />
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp" />
    <title>Register & Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="Login.css">
    <style>
        /* Add any additional styles here */
    </style>
</head>
<body>
    
    <!-- Registration Form -->
    <div class="container" id="signUp" style="display:none;">
        <h1 class="form-title">Register</h1>
        <form method="post" action="login.php"> <!-- Make sure this points to your PHP handler -->
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" name="fName" id="fName" placeholder="First Name" required>
                <label for="fname">First Name</label>
            </div>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" name="lName" id="lName" placeholder="Last Name" required>
                <label for="lname">Last Name</label>
            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" id="email" placeholder="Email" required>
                <label for="email">Email</label>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" id="password" placeholder="Password" required> <!-- Added 'name' attribute -->
                <label for="password">Password</label>
            </div>
            <input type="submit" class="btn" value="Sign Up" name="signUp">
        </form>
        <div class="links">
            <p>Already Have an Account?</p>
            <button id="signInButton">Sign In</button>
        </div>
    </div>

    <!-- Login Form -->
    <div class="container" id="signIn">
        <h1 class="form-title">Sign In</h1>
        <form method="post" action="login.php"> <!-- Make sure this points to your PHP handler -->
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" id="emailSignIn" placeholder="Email" required>
                <label for="email">Email</label>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" id="passwordSignIn" placeholder="Password" required> <!-- Added 'name' attribute -->
                <label for="password">Password</label>
            </div>
            <p class="recover">
                <a href="#">Recover Password</a>
            </p>
            <input type="submit" class="btn" value="Sign In" name="signIn">
        </form>
        <p class="or">----------or----------</p>
        <button id="googleSignIn" class="google-btn">
            <i class="fab fa-google"></i> Sign in with Google
        </button>
        <div class="links">
            <p>Don't Have an Account yet?</p>
            <button id="signUpButton">Sign Up</button>
        </div>
    </div>

    <div id="userInfo"></div>

    <script src="https://apis.google.com/js/platform.js" async defer></script>
    <script>
        function initGoogleSignIn() {
            gapi.load('auth2', function() {
                const auth2 = gapi.auth2.init({
                    client_id: '476739511154-hud6rssbai396uh2d4bkuiaa5u0dfcgn.apps.googleusercontent.com', // Replace with your Client ID
                    scope: 'profile email',
                });

                const googleSignInButtons = document.querySelectorAll('#googleSignIn');

                googleSignInButtons.forEach(button => {
                    button.addEventListener('click', function() {
                        auth2.signIn().then(function(googleUser) {
                            const profile = googleUser.getBasicProfile();
                            document.getElementById('userInfo').innerHTML = `
                                <h2>Welcome, ${profile.getName()}!</h2>
                                <p>Email: ${profile.getEmail()}</p>
                                <img src="${profile.getImageUrl()}" alt="Profile Picture">
                            `;
                            document.querySelectorAll('.container').forEach(container => {
                                container.style.display = 'none'; // Hide both sign-up and sign-in
                            });
                        }).catch(function(error) {
                            console.error('Error signing in: ', error);
                        });
                    });
                });
            });
        }

        window.onload = function() {
            initGoogleSignIn();

            // Toggle between Sign Up and Sign In forms
            document.getElementById('signInButton').onclick = function() {
                document.getElementById('signUp').style.display = 'none';
                document.getElementById('signIn').style.display = 'block';
            };

            document.getElementById('signUpButton').onclick = function() {
                document.getElementById('signIn').style.display = 'none';
                document.getElementById('signUp').style.display = 'block';
            };
        };
    </script>
</body>
</html>
